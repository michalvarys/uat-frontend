name: Build production image

# Spouští se při pushnutí tagu verze (v1.2.3) a lze spustit i ručně
# z záložky Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      be_domain:
        description: 'Doména backendu'
        required: true
        default: 'cms.uat.sk'
      fe_domain:
        description: 'Doména frontendu'
        required: true
        default: 'uat.sk'
      push:
        description: 'Odeslat image do Docker Hubu'
        type: boolean
        default: true

env:
  IMAGE: varyshop/uat-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavit parametry buildu
        id: cfg
        run: |
          # NEXT_PUBLIC_* se zapékají do bundlu, takže musí být známé už teď.
          BE="${{ github.event.inputs.be_domain || 'cms.uat.sk' }}"
          FE="${{ github.event.inputs.fe_domain || 'uat.sk' }}"
          echo "be_domain=$BE"   >> "$GITHUB_OUTPUT"
          echo "fe_domain=$FE"   >> "$GITHUB_OUTPUT"
          echo "api_url=https://$BE"      >> "$GITHUB_OUTPUT"
          echo "base_url=https://$FE/cms" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Tag v1.2.3 dá image 1.2.3 a zároveň latest.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Přihlásit se do Docker Hubu
        if: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build a push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.cfg.outputs.api_url }}
            NEXT_PUBLIC_IMAGE_URL=${{ steps.cfg.outputs.api_url }}
            NEXT_PUBLIC_API_PORT=443
            NEXT_PUBLIC_SECURE_API_PORT=443
            NEXT_PUBLIC_BASE_URL=${{ steps.cfg.outputs.base_url }}
            NEXT_FRONTEND_DOMAIN=${{ steps.cfg.outputs.fe_domain }}
            NEXT_BACKEND_DOMAIN=${{ steps.cfg.outputs.be_domain }}

      - name: Shrnutí
        run: |
          {
            echo "### Build hotový"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| Backend | ${{ steps.cfg.outputs.api_url }} |"
            echo "| Frontend | https://${{ steps.cfg.outputs.fe_domain }} |"
          } >> "$GITHUB_STEP_SUMMARY"
